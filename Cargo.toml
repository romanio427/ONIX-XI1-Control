[package]
name = "onix-xi1-control"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "PC control for the ONIX Alpha XI1 USB DAC"
publish = false
build = "native/build.rs"

[features]
default = []
# The release pipeline builds this variant as one self-contained Windows EXE.
# It remains a single EXE; settings live in LocalAppData like the installed edition.
portable = []

[[bin]]
name = "onix-xi1-pc"
path = "native/main.rs"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "unstable-winit-030", "system-tray"] }
nusb = "=0.2.7"
sys-locale = "=0.3.2"
interprocess = { version = "2.4.3", features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util"] }
futures-lite = "2.6"
async-channel = "2.5"
async-io = "2.6"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
async-hid = { version = "=0.5.3", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
x11rb = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen", "NSEvent", "objc2-core-graphics"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Devices_DeviceAndDriverInstallation"] }
windows = { version = "=0.61.3", default-features = false, features = ["UI_ViewManagement"] }

[target.'cfg(all(windows, target_env = "msvc"))'.dependencies]
wdi-rs = "=0.1.1"

[build-dependencies]
slint-build = "=1.17.1"
winresource = "=0.1.31"

[package.metadata.winresource]
ProductName = "ONIX DAC Control"
FileDescription = "ONIX DAC Control"
OriginalFilename = "onix-xi1-pc.exe"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 0
incremental = false
